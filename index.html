<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesta De Integración Grupal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap">
<style>
/* Sistema "Facultad De Contaduría Y Administración" (FCA UAQ): un solo tema claro, fondo blanco, esquinas rectas.
   Layout: membrete verde-fca con escudos → banda verde-oscuro → formulario por secciones sobre blanco → pie azul-marino. */
:root{
  color-scheme:light;
  --verde-fca:#005850; --verde-oscuro:#074A41; --verde-profundo:#003F3D; --verde-titulo:#004A44; --verde-medio:#7FB2AB;
  --menta:#CFE3E0; --lima:#C4D028; --azul-marino:#194563; --blanco:#FFFFFF;
  --gris-texto:#4D4D4D; --gris-suave:#666666; --linea:#D5E3E0; --forma-fondo:#F7F7F7;
  --verde-tinte:#EAF2F0; --error:#A3261B; --error-tinte:#FBECEA;
  --gothic:"Century Gothic","TeX Gyre Adventor","URW Gothic","Didact Gothic",Questrial,sans-serif;
}
*{box-sizing:border-box}
html, body{margin:0}
img{max-width:100%}
[hidden]{display:none !important}
body{background:var(--blanco); color:var(--gris-texto); font-family:var(--gothic); font-size:17px; line-height:1.5}
/* Toda la página en Mayúscula Inicial; lo que escribe cada persona y los correos se respetan tal cual. */
body, button{text-transform:capitalize}
input, textarea, .sin-mayus{text-transform:none}
textarea::placeholder{text-transform:capitalize}
.gutter{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.ancho{max-width:720px; margin:0 auto; width:100%}
.pila{display:flex; flex-direction:column; gap:36px}
h1,h2,h3{font-family:var(--gothic); font-weight:700; margin:0; text-wrap:balance}
p{margin:0}
button:focus-visible, textarea:focus-visible, input:focus-visible{outline:3px solid var(--azul-marino); outline-offset:2px}

/* Membrete */
.membrete{background:var(--verde-fca); color:var(--blanco); padding-block:12px}
.membrete .ancho{display:flex; align-items:center; justify-content:space-between; gap:12px}
.escudos{display:flex; align-items:center; gap:12px}
.escudos img{height:52px; width:auto}
.membrete .der{font-size:14px; font-weight:700; color:var(--menta); text-align:right; font-variant-numeric:tabular-nums}

/* Banda */
.banda{background:var(--verde-oscuro); color:var(--blanco); padding-block:30px 34px; position:relative; overflow:hidden}
.lineas{position:absolute; top:0; right:0; width:72px; height:64px; overflow:hidden; pointer-events:none}
.lineas i{position:absolute; top:-10px; width:2px; height:150px; background:var(--lima); transform:rotate(40deg); transform-origin:top}
.lineas i:nth-child(1){right:-30px} .lineas i:nth-child(2){right:-6px} .lineas i:nth-child(3){right:18px}
.banda .ancho{display:flex; flex-direction:column; gap:12px; position:relative; z-index:1}
.etq-lima{font-size:13px; font-weight:700; letter-spacing:.04em; color:var(--lima)}
.banda h1{font-size:clamp(30px,8vw,44px); line-height:1.1; color:var(--blanco); padding-right:60px}
.banda .desc{color:var(--menta); max-width:60ch}
.pestanas{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
.pestana{font:inherit; font-size:15px; font-weight:700; padding:8px 14px; background:transparent; color:var(--menta); border:1.5px solid var(--verde-medio); cursor:pointer; border-radius:0}
.pestana[aria-selected="true"]{background:var(--lima); color:var(--verde-profundo); border-color:var(--lima)}

/* Secciones */
main.cuerpo{padding-block:32px 48px}
.seccion{display:flex; flex-direction:column; gap:16px}
.encabezado{display:flex; flex-direction:column; gap:6px}
.etq{font-size:13px; font-weight:700; color:var(--verde-fca); font-variant-numeric:tabular-nums}
.encabezado h2{font-size:24px; line-height:1.15; color:var(--verde-titulo)}
.encabezado h2::after{content:""; display:block; width:64px; height:5px; background:var(--verde-fca); margin-top:8px}
.nota{font-size:15px; color:var(--gris-suave)}
.aviso{border:1.5px solid var(--verde-fca); background:var(--verde-tinte); padding:14px 16px; font-size:15px}
.aviso.error{border-color:var(--error); background:var(--error-tinte); color:var(--error)}

/* Opciones tipo tarjeta (radio) */
.opciones{display:grid; gap:10px}
.opciones.dos{grid-template-columns:repeat(auto-fit, minmax(240px, 1fr))}
.op{display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; font:inherit; color:var(--gris-texto); background:var(--blanco); border:1.5px solid var(--linea); padding:12px 14px; cursor:pointer; border-radius:0}
.op:hover{border-color:var(--verde-fca)}
.op .marca{flex:none; width:22px; height:22px; border:1.5px solid var(--verde-medio); margin-top:1px}
.op b{display:block; color:var(--verde-titulo); font-size:17px}
.op small{display:block; font-size:14px; color:var(--gris-suave)}
.op span{min-width:0}
.op[aria-checked="true"]{border:2px solid var(--verde-fca); background:var(--verde-tinte); padding:11.5px 13.5px}
.op[aria-checked="true"] .marca{border-color:var(--verde-fca); background:var(--verde-fca); box-shadow:inset 0 0 0 4px var(--blanco)}
input.campo, textarea{width:100%; font:inherit; color:var(--gris-texto); background:var(--blanco); border:1.5px solid var(--verde-medio); padding:12px; border-radius:0}
textarea{min-height:120px; resize:vertical}
label.lab{font-size:14px; font-weight:700; color:var(--verde-titulo); display:block; margin-bottom:6px}
.contador{font-size:13px; color:var(--gris-suave); text-align:right; font-variant-numeric:tabular-nums}

/* Pregunta */
.preg{display:flex; flex-direction:column; gap:12px; padding-top:18px; border-top:1px solid var(--linea)}
.preg:first-of-type{border-top:0; padding-top:0}
.preg .num{font-size:13px; font-weight:700; color:var(--verde-fca); font-variant-numeric:tabular-nums}
.preg .q{font-weight:700; color:var(--verde-titulo); font-size:clamp(18px,4.6vw,20px); line-height:1.3; text-wrap:pretty}
.preg.falta .q{color:var(--error)}
.preg.falta .num::after{content:" · Falta Responder"; color:var(--error)}
.preg.falta .lab{color:var(--error)}
.preg.falta .campo{border-color:var(--error)}

/* Barra con carita */
.nivel{display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:center}
.cara{width:76px; height:76px; flex:none}
.cara svg{width:100%; height:100%; display:block}
.cara .rostro, .cara .rasgo{transition:fill .25s, stroke .25s}
.cara .boca, .cara .ceja{transition:d .25s}
.control{display:flex; flex-direction:column; gap:6px; min-width:0}
.lectura{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.lectura .valor{font-size:30px; font-weight:700; line-height:1; color:var(--verde-fca); font-variant-numeric:tabular-nums; min-width:2ch}
.lectura .estado{font-size:15px; font-weight:700; color:var(--gris-suave)}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:32px; background:transparent; margin:0; cursor:pointer; --pct:50%; --tono:var(--verde-medio)}
input[type=range]::-webkit-slider-runnable-track{height:8px; background:linear-gradient(90deg, var(--tono) 0 var(--pct), var(--linea) var(--pct) 100%)}
input[type=range]::-moz-range-track{height:8px; background:linear-gradient(90deg, var(--tono) 0 var(--pct), var(--linea) var(--pct) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:28px; height:28px; margin-top:-10px; background:var(--blanco); border:3px solid var(--tono); border-radius:0}
input[type=range]::-moz-range-thumb{width:22px; height:22px; background:var(--blanco); border:3px solid var(--tono); border-radius:0}
input[type=range]:focus-visible{outline:3px solid var(--azul-marino); outline-offset:4px}
.marcas{display:flex; justify-content:space-between; padding:0 4px}
.marcas button{width:20px; font:inherit; font-size:13px; font-weight:700; color:var(--gris-suave); background:none; border:0; padding:2px 0; cursor:pointer; text-align:center; font-variant-numeric:tabular-nums}
.marcas button[aria-current="true"]{color:var(--verde-fca)}
.extremos{display:flex; justify-content:space-between; font-size:13px; color:var(--gris-suave); gap:12px}

.btn{font:inherit; font-weight:700; font-size:17px; padding:15px 18px; cursor:pointer; border:2px solid var(--verde-fca); background:var(--verde-fca); color:var(--blanco); width:100%; border-radius:0}
.btn.contorno{background:var(--blanco); color:var(--verde-fca)}
.btn:disabled{opacity:.55; cursor:default}
.fila{display:flex; gap:12px; flex-wrap:wrap}
.fila > *{flex:1 1 220px}

/* Confirmación */
.listo{background:var(--verde-fca); color:var(--blanco); outline:1.5px solid var(--verde-medio); outline-offset:-7px; padding:24px 24px 26px; display:flex; flex-direction:column; gap:8px}
.listo strong{font-size:24px}
.listo span{color:var(--menta)}

/* Resultados */
.dato{background:var(--verde-profundo); color:var(--blanco); padding:22px; display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:18px}
.dato div{display:flex; flex-direction:column; gap:4px}
.cifra{font-weight:700; color:var(--lima); font-size:clamp(44px,12vw,64px); line-height:1; font-variant-numeric:tabular-nums}
.cifra small{font-size:22px; color:var(--menta); font-weight:400}
.dato p{color:var(--menta); font-size:15px}
.lectura-final{background:var(--azul-marino); color:var(--blanco); padding:20px 22px; display:flex; flex-direction:column; gap:10px}
.lectura-final .etq{color:var(--lima)}
.lectura-final ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px}
.res-nivel{display:grid; grid-template-columns:56px minmax(0,1fr); gap:14px; align-items:start; padding-block:14px; border-top:1px solid var(--linea)}
.res-nivel .cara{width:56px; height:56px}
.res-nivel .t{font-weight:700; color:var(--verde-titulo); line-height:1.3}
.res-nivel .prom{font-weight:700; color:var(--verde-fca); font-variant-numeric:tabular-nums}
.dist{display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); gap:3px; align-items:end; height:46px; margin-top:8px}
.dist i{display:block; background:var(--verde-medio); min-height:2px}
.dist-num{display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); gap:3px; font-size:11px; color:var(--gris-suave); text-align:center; font-variant-numeric:tabular-nums}
.barras{display:grid; gap:12px}
.barras .r{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 12px; font-variant-numeric:tabular-nums}
.barras .r b{color:var(--verde-fca)}
.pista{grid-column:1 / -1; height:8px; background:var(--linea)}
.pista i{display:block; height:100%; background:var(--verde-fca)}
.respuestas-ab{display:grid; gap:10px}
.resp{border:1.5px solid var(--linea); padding:12px 14px; display:flex; flex-direction:column; gap:4px}
.resp .quien{font-size:13px; font-weight:700; color:var(--gris-suave)}
.vacio{border:1.5px dashed var(--verde-medio); padding:20px; color:var(--gris-suave)}
.registro{display:grid; border-top:1px solid var(--linea)}
.fila-reg{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 12px; align-items:center; padding-block:12px; border-bottom:1px solid var(--linea)}
.fila-reg.activa{background:var(--error-tinte); padding-inline:12px}
.fila-reg .who{display:flex; flex-direction:column; gap:2px; min-width:0}
.fila-reg .correo{font-weight:700; color:var(--verde-titulo); overflow-wrap:anywhere}
.fila-reg .acc{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
.confirma{grid-column:1 / -1; font-size:15px; font-weight:700; color:var(--error)}
.confirma.fuerte{border-left:4px solid var(--error); padding-left:10px}
.mini{font:inherit; font-size:14px; font-weight:700; padding:7px 12px; cursor:pointer; background:var(--blanco); color:var(--gris-texto); border:1.5px solid var(--linea); border-radius:0}
.mini.peligro{color:var(--error); border-color:var(--error)}
.mini.peligro.lleno{background:var(--error); color:var(--blanco)}
.mini:disabled{opacity:.55; cursor:default}
@media (max-width:420px){ .fila-reg{grid-template-columns:1fr} .fila-reg .acc{justify-content:flex-start} }

footer{background:var(--azul-marino); color:var(--blanco); padding-block:22px 28px; position:relative; overflow:hidden}
footer::before, footer::after{content:""; position:absolute; border:1.5px solid rgba(255,255,255,.35); border-radius:999px; pointer-events:none}
footer::before{width:150px; height:150px; right:-50px; top:-60px}
footer::after{width:90px; height:90px; right:30px; top:-30px}
footer .ancho{display:flex; align-items:center; gap:16px; flex-wrap:wrap; position:relative; z-index:1}
footer img{height:34px; width:auto}
footer p{font-size:14px; color:var(--blanco)}
footer .admin{margin-left:auto; font:inherit; font-size:13px; font-weight:700; color:var(--lima); background:none; border:1.5px solid var(--lima); padding:6px 12px; cursor:pointer; border-radius:0}
footer .admin:hover{background:var(--lima); color:var(--azul-marino)}
.candado{border:1.5px solid var(--verde-fca); padding:20px; display:flex; flex-direction:column; gap:14px; max-width:460px}
.candado .campo.mal{border-color:var(--error)}
.leyenda{font-size:14px; font-weight:700; color:var(--verde-fca)}
.op[role="checkbox"] .marca{position:relative}
.op[role="checkbox"][aria-checked="true"] .marca{box-shadow:none}
.op[role="checkbox"][aria-checked="true"] .marca::after{content:""; position:absolute; left:6px; top:2px; width:6px; height:11px; border:solid var(--blanco); border-width:0 3px 3px 0; transform:rotate(45deg)}
@keyframes entra{from{opacity:.4; transform:translateY(10px)} to{opacity:1; transform:none}}
.anima{animation:entra .4s cubic-bezier(.2,.7,.2,1) both}
@media (max-width:420px){ .nivel{grid-template-columns:1fr} .cara{width:64px; height:64px} }
@media (prefers-reduced-motion: reduce){ *, *::before, *::after{animation:none !important; transition:none !important} }
</style>
</head>

<div id="app" aria-live="polite"></div>
<footer class="gutter"><div class="ancho" id="pie"></div></footer>

/* ---------- Conexión con Google ---------- */
const GS = () => window.google && google.script && google.script.run;
const CONECTADA = !!GS() || /^https:\/\/script\.google\.com\//.test(ENDPOINT);
function api(fn, ...args){
  if (GS()) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  if (!CONECTADA) return Promise.reject(new Error("sin_conexion"));
  return fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({fn, args})}).then(r => r.json());
}

/* ---------- Carita ---------- */
const STOPS = [[1,[163,38,27]], [5.5,[196,208,40]], [10,[0,88,80]]];
function tono(v){
  if (v == null) return "#7FB2AB";
  let a = STOPS[0], b = STOPS[STOPS.length - 1];
  for (let i = 0; i < STOPS.length - 1; i++) if (v >= STOPS[i][0] && v <= STOPS[i+1][0]){ a = STOPS[i]; b = STOPS[i+1]; }
  const t = b[0] === a[0] ? 0 : (v - a[0]) / (b[0] - a[0]);
  const c = a[1].map((x, i) => Math.round(x + (b[1][i] - x) * t));
  return `rgb(${c.join(",")})`;
}
function rasgo(v){
  if (v == null) return "#4D4D4D";
  if (v >= 4.5 && v <= 7) return "#5E6612";
  return tono(v);
}
function tinte(v){
  if (v == null) return "#F7F7F7";
  const m = tono(v).match(/\d+/g).map(Number).map(x => Math.round(x + (255 - x) * .86));
  return `rgb(${m.join(",")})`;
}
function caraSVG(v){
  const t = v == null ? .5 : (v - 1) / 9;
  const cy = 66 + (t - .5) * 34;
  const by = v == null ? 0 : (.5 - t) * 8;
  const ojo = 4 + t * .8;
  const col = rasgo(v);
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <circle class="rostro" cx="50" cy="50" r="45" fill="${tinte(v)}" stroke="${tono(v)}" stroke-width="5"/>
    <path class="ceja" d="M27 ${33 - by} L41 ${33 + by}" stroke="${col}" stroke-width="4" stroke-linecap="square" fill="none"/>
    <path class="ceja" d="M59 ${33 + by} L73 ${33 - by}" stroke="${col}" stroke-width="4" stroke-linecap="square" fill="none"/>
    <circle class="rasgo" cx="36" cy="45" r="${ojo}" fill="${col}"/>
    <circle class="rasgo" cx="64" cy="45" r="${ojo}" fill="${col}"/>
    <path class="boca" d="M31 66 Q50 ${cy} 69 66" stroke="${col}" stroke-width="5" stroke-linecap="square" fill="none"/>
  </svg>`;
}
const ESTADO = v => v == null ? "Arrastra Para Responder" : v <= 2 ? "Muy Insatisfecho" : v <= 4 ? "Insatisfecho" : v <= 6 ? "Regular" : v <= 8 ? "Satisfecho" : "Muy Satisfecho";

/* ---------- Acceso de administradores ---------- */
function renderClave(){
  $app.innerHTML = `${membrete("Acceso Restringido")}${banda(true)}
  <main class="cuerpo gutter"><div class="ancho pila">
    <form class="candado" id="f-clave" novalidate>
      <div class="encabezado"><span class="etq">Solo Administradores</span><h2>Escribe La Contraseña</h2></div>
      <label class="lab" for="clave">Contraseña De Resultados</label>
      <input class="campo${S.claveError ? " mal" : ""}" id="clave" type="password" autocomplete="current-password" spellcheck="false">
      ${S.claveError ? `<p class="aviso error">${esc(S.claveError)}</p>` : ""}
      <button class="btn" id="b-clave" type="submit">Ver Resultados</button>
    </form>
  </div></main>`;
  enlazarPestanas();
  const inp = document.getElementById("clave"); inp.focus();
  document.getElementById("f-clave").onsubmit = async e => {
    e.preventDefault();
    const b = document.getElementById("b-clave"); b.disabled = true; b.textContent = "Revisando…";
    let r;
    try { r = await api("resultados", inp.value); } catch (err){ r = {error:"conexion"}; }
    if (r && r.ok){
      S.clave = inp.value; S.desbloqueado = true; S.claveError = ""; S.vista = "res"; Respuestas = r.ok;
      iniciarRefresco(); render(); window.scrollTo(0,0); return;
    }
    S.claveError = r && r.error === "clave" ? "La contraseña no es correcta. Revisa mayúsculas, minúsculas y guiones."
      : r && r.error === "bloqueado" ? "Hubo demasiados intentos fallidos. Espera 10 minutos y vuelve a intentarlo."
      : "No se pudo conectar con la hoja de respuestas. Revisa tu internet y vuelve a intentarlo.";
    renderClave();
  };
}
async function cargarResultados(){
  if (!S.desbloqueado) return;
  try {
    const r = await api("resultados", S.clave);
    if (r && r.ok){ Respuestas = r.ok; S.resError = ""; }
    else S.resError = "No se pudieron actualizar los resultados. Vuelve a escribir la contraseña.";
  } catch (e){ S.resError = "No se pudieron actualizar los resultados por un problema de conexión."; }
  if (S.vista === "res" && !S.borrar) renderRes();
}
function iniciarRefresco(){
  if (refresco) return;
  refresco = setInterval(() => { if (S.vista === "res" && document.visibilityState === "visible") cargarResultados(); }, 30000);
}

function actualizarCabecera(){ const d = document.getElementById("der"); if (d) d.textContent = `${respondidas()} De ${TOTAL} Respondidas`; }
function quitarFalta(id){ S.faltan = S.faltan.filter(x => x !== id); document.getElementById("p-" + id)?.classList.remove("falta"); }

function pintarNivel(id){
  const v = S.niveles[id] ?? null, r = document.getElementById("r-" + id);
  document.getElementById("cara-" + id).innerHTML = caraSVG(v);
  document.getElementById("val-" + id).textContent = v ?? "–";
  document.getElementById("val-" + id).style.color = v == null ? "" : rasgo(v);
  document.getElementById("est-" + id).textContent = ESTADO(v);
  const valor = v ?? 5;
  r.value = valor;
  r.style.setProperty("--pct", ((valor - 1) / 9 * 100) + "%");
  r.style.setProperty("--tono", tono(v));
  r.setAttribute("aria-valuetext", v ? `${v} de 10, ${ESTADO(v)}` : "sin responder");
  r.closest(".control").querySelectorAll(".marcas button").forEach(b => b.setAttribute("aria-current", String(+b.dataset.k === v)));
}
function fijarNivel(id, v){ S.niveles[id] = v; pintarNivel(id); quitarFalta(id); actualizarCabecera(); }

function enlazarForm(){
  NIVELES.forEach(p => pintarNivel(p.id));
  const cor = document.getElementById("correo");
  if (cor) cor.oninput = () => { S.correo = cor.value; if (correoValido(cor.value)) quitarFalta("correo"); };
  $app.querySelectorAll('input[type=range]').forEach(r => {
    const id = r.dataset.id;
    r.oninput = () => fijarNivel(id, +r.value);
    r.onpointerdown = () => { if (S.niveles[id] == null) requestAnimationFrame(() => fijarNivel(id, +r.value)); };
  });
  $app.querySelectorAll(".marcas button").forEach(b => b.onclick = () => fijarNivel(b.dataset.id, +b.dataset.k));
  $app.querySelectorAll('.op[role="checkbox"]').forEach(b => b.onclick = () => {
    const id = b.dataset.id, p = MULTIPLES.find(m => m.id === id), o = p.o[+b.dataset.i];
    let sel = lista(S.multiples[id]).slice();
    sel = sel.includes(o) ? sel.filter(x => x !== o) : sel.concat(o);
    S.multiples[id] = p.o.filter(x => sel.includes(x));
    if (sel.length) quitarFalta(id);
    b.parentElement.querySelectorAll(".op").forEach(x => x.setAttribute("aria-checked", String(sel.includes(p.o[+x.dataset.i]))));
    actualizarCabecera();
  });
  $app.querySelectorAll("textarea[data-id]").forEach(t => t.oninput = () => {
    const id = t.dataset.id; S.abiertas[id] = t.value;
    document.getElementById("c-" + id).textContent = `${t.value.length} / ${MAXTXT}`;
    if (t.value.trim()) quitarFalta(id); actualizarCabecera();
  });
  document.getElementById("forma").onsubmit = e => { e.preventDefault(); enviar(); };
}

async function enviar(){
  if (S.enviando || !CONECTADA) return;
  const faltan = [];
  if (!correoValido(S.correo)) faltan.push("correo");
  NIVELES.forEach(p => { if (S.niveles[p.id] == null) faltan.push(p.id); });
  MULTIPLES.forEach(p => { if (!lista(S.multiples[p.id]).length) faltan.push(p.id); });
  ABIERTAS.forEach(p => { if (!(S.abiertas[p.id] || "").trim()) faltan.push(p.id); });
  S.faltan = faltan;
  if (faltan.length){
    const preg = faltan.filter(x => x !== "correo").length;
    const partes = [];
    if (faltan.includes("correo")) partes.push(S.correo.trim() ? "Revisa tu correo electrónico, parece incompleto." : "Escribe tu correo electrónico.");
    if (preg) partes.push(`Te ${preg === 1 ? "falta 1 pregunta" : `faltan ${preg} preguntas`} por responder.`);
    S.error = partes.join(" ") + " Lo que falta está marcado en rojo.";
    renderForm();
    document.getElementById("p-" + faltan[0])?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"});
    return;
  }
  S.error = ""; S.enviando = true; renderForm();
  const correo = S.correo.trim().toLowerCase().slice(0, 120);
  const doc = {
    correo,
    niveles: Object.fromEntries(NIVELES.map(p => [p.id, S.niveles[p.id]])),
    multiples: Object.fromEntries(MULTIPLES.map(p => [p.id, lista(S.multiples[p.id]).filter(o => p.o.includes(o))])),
    abiertas: Object.fromEntries(ABIERTAS.map(p => [p.id, (S.abiertas[p.id] || "").trim().slice(0, MAXTXT)])),
  };
  let r;
  try { r = await api("enviar", doc); } catch (e){ r = {error:"conexion"}; }
  S.enviando = false;
  if (r && r.ok){
    guardarMarca(correo); S.correo = correo; S.enviado = true; render(); window.scrollTo(0,0); return;
  }
  S.error = r && r.error === "duplicado"
    ? "Este correo ya registró una respuesta. Cada correo puede responder la encuesta una sola vez."
    : r && r.error === "datos"
    ? "Algunas respuestas no llegaron completas. Revísalas y vuelve a enviar."
    : "No se pudo enviar por un problema de conexión. Revisa tu internet y vuelve a intentarlo.";
  renderForm();
  document.getElementById("error")?.scrollIntoView({block:"center"});
}

/* ---------- Resultados ---------- */
const prom = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
const f1 = x => x == null ? "–" : x.toFixed(1);
function renderRes(){
  const R = Respuestas.slice().sort((a, b) => String(a.enviado).localeCompare(String(b.enviado))), total = R.length;
  const porNivel = NIVELES.map(p => {
    const vals = R.map(r => r.niveles && r.niveles[p.id]).filter(v => typeof v === "number" && v >= 1 && v <= 10);
    const dist = Array.from({length:10}, (_, i) => vals.filter(v => v === i + 1).length);
    return {p, vals, media: prom(vals), dist};
  });
  const indice = prom(porNivel.map(x => x.media).filter(x => x != null));
  const porMult = MULTIPLES.map(p => {
    const cuenta = p.o.map(o => [o, R.filter(r => r.multiples && lista(r.multiples[p.id]).includes(o)).length]);
    return {p, cuenta: cuenta.sort((a, b) => b[1] - a[1])};
  });

  let lectura = "";
  if (total){
    const nivel = indice >= 7.5 ? "alta" : indice >= 5.5 ? "media" : "baja";
    const orden = porNivel.filter(x => x.media != null).slice().sort((a, b) => a.media - b.media);
    const bajo = orden[0], alto = orden[orden.length - 1];
    const ob = porMult[0].cuenta[0], ac = porMult[1].cuenta[0];
    lectura = `<div class="lectura-final">
      <span class="etq">Lectura Rápida</span>
      <ul>
        <li>El grupo percibe una integración <b>${nivel}</b>: el promedio de los seis niveles es ${f1(indice)} de 10.</li>
        <li>Lo mejor valorado: “${esc(alto.p.q)}” con ${f1(alto.media)}.</li>
        <li>Lo que más hay que trabajar: “${esc(bajo.p.q)}” con ${f1(bajo.media)}.</li>
        ${ob[1] ? `<li>El obstáculo más señalado es “${esc(ob[0])}”: lo eligieron ${ob[1]} de ${total} personas.</li>` : ""}
        ${ac[1] ? `<li>La actividad que más se pide es “${esc(ac[0])}”: la eligieron ${ac[1]} de ${total} personas.</li>` : ""}
      </ul>
      <p style="color:var(--menta); font-size:14px">Esta lectura se calcula sola con las respuestas; revísala junto con las respuestas abiertas.</p>
    </div>`;
  }

  let sec = 0;
  $app.innerHTML = `${membrete("Resultados")}${banda(true)}
  <main class="cuerpo gutter"><div class="ancho pila">
    ${S.resError ? `<div class="aviso error">${esc(S.resError)}</div>` : ""}
    ${!total ? `<div class="vacio">Todavía no hay respuestas. Cuando tus compañeros envíen la encuesta, aquí verás los promedios, las elecciones y lo que escribieron.</div>` : `
    <div class="dato">
      <div><span class="cifra">${total}</span><p>Respuestas registradas</p></div>
      <div><span class="cifra">${f1(indice)}<small> / 10</small></span><p>Índice de integración (promedio de los seis niveles)</p></div>
    </div>
    ${lectura}
    <section class="seccion">
      <div class="encabezado"><span class="etq">${nn(++sec)} · Niveles De Satisfacción</span><h2>Promedio Por Pregunta</h2></div>
      <div>${porNivel.map((x, i) => { const max = Math.max(...x.dist, 1); return `
        <div class="res-nivel">
          <div class="cara">${caraSVG(x.media == null ? null : Math.round(x.media * 10) / 10)}</div>
          <div>
            <p class="t">${nn(i + 1)}. ${esc(x.p.q)}</p>
            <p><span class="prom">${f1(x.media)} / 10</span> <span class="nota">· ${x.vals.length} respuestas</span></p>
            <div class="dist" aria-label="Distribución de respuestas del 1 al 10">${x.dist.map((c, k) => `<i title="${k + 1}: ${c}" style="height:${c / max * 100}%; background:${c ? tono(k + 1) : "var(--linea)"}"></i>`).join("")}</div>
            <div class="dist-num">${x.dist.map((c, k) => `<span>${k + 1}</span>`).join("")}</div>
          </div>
        </div>`; }).join("")}</div>
    </section>
    ${porMult.map(x => `
    <section class="seccion">
      <div class="encabezado"><span class="etq">${nn(++sec)} · Opción Múltiple</span><h2>${esc(x.p.q)}</h2></div>
      <p class="nota">Cada persona podía elegir varias opciones; el porcentaje es sobre ${total} ${total === 1 ? "persona" : "personas"}, por eso puede sumar más de 100 %.</p>
      <div class="barras">${x.cuenta.map(([o, c]) => `
        <div class="r"><span>${esc(o)}</span><b>${c} · ${Math.round(c / total * 100)} %</b><div class="pista"><i style="width:${c / total * 100}%"></i></div></div>`).join("")}</div>
    </section>`).join("")}
    ${ABIERTAS.map(p => `
    <section class="seccion">
      <div class="encabezado"><span class="etq">${nn(++sec)} · Pregunta Abierta</span><h2>${esc(p.q)}</h2></div>
      <div class="respuestas-ab">${R.filter(r => r.abiertas && r.abiertas[p.id]).map(r => `
        <div class="resp"><span class="quien sin-mayus">${esc(r.correo || "Sin correo")}</span><span>${esc(r.abiertas[p.id])}</span></div>`).join("")}</div>
    </section>`).join("")}
    <section class="seccion">
      <div class="encabezado"><span class="etq">${nn(++sec)} · Administración</span><h2>Registro De Respuestas</h2></div>
      <p class="nota">Al eliminar una respuesta, se borra de la hoja de Google y de todos los resultados, y esa persona podrá volver a responder.</p>
      ${S.borrarError ? `<div class="aviso error">${esc(S.borrarError)}</div>` : ""}
      <div class="registro">${R.map((r, i) => registroFila(r, i)).join("")}</div>
    </section>`}
  </div></main>`;
  enlazarPestanas();
  enlazarRegistro();
}

const fecha = iso => { try { return new Date(iso).toLocaleString("es-MX", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}); } catch (e){ return ""; } };
function registroFila(r, i){
  const b = S.borrar && S.borrar.id === r._id ? S.borrar : null;
  let acciones = `<button type="button" class="mini peligro" data-borrar="${esc(r._id)}">Eliminar</button>`;
  let aviso = "";
  if (b && b.paso === 1){
    aviso = `<div class="confirma">¿Eliminar la respuesta de <span class="sin-mayus">${esc(r.correo || "este usuario")}</span>?</div>`;
    acciones = `<button type="button" class="mini peligro lleno" data-paso2="${esc(r._id)}">Sí, Eliminar</button><button type="button" class="mini" data-cancelar>Cancelar</button>`;
  } else if (b && b.paso === 2){
    aviso = `<div class="confirma fuerte">Confirmación final: la respuesta se borrará para siempre y no se puede recuperar.</div>`;
    acciones = `<button type="button" class="mini peligro lleno" data-final="${esc(r._id)}" ${S.borrando ? "disabled" : ""}>${S.borrando ? "Eliminando…" : "Eliminar Definitivamente"}</button><button type="button" class="mini" data-cancelar ${S.borrando ? "disabled" : ""}>Cancelar</button>`;
  }
  return `<div class="fila-reg${b ? " activa" : ""}">
    <div class="who"><span class="etq">Usuario ${nn(i + 1)}</span><span class="sin-mayus correo">${esc(r.correo || "Sin correo")}</span><span class="nota">${esc(fecha(r.enviado))}</span></div>
    <div class="acc">${acciones}</div>
    ${aviso}
  </div>`;
}
function enlazarRegistro(){
  $app.querySelectorAll("[data-borrar]").forEach(b => b.onclick = () => { S.borrar = {id:b.dataset.borrar, paso:1}; S.borrarError = ""; renderRes(); });
  $app.querySelectorAll("[data-paso2]").forEach(b => b.onclick = () => { S.borrar = {id:b.dataset.paso2, paso:2}; renderRes(); });
  $app.querySelectorAll("[data-cancelar]").forEach(b => b.onclick = () => { S.borrar = null; renderRes(); });
  $app.querySelectorAll("[data-final]").forEach(b => b.onclick = async () => {
    if (S.borrando) return;
    S.borrando = true; renderRes();
    let r;
    try { r = await api("eliminar", S.clave, b.dataset.final); } catch (e){ r = {error:"conexion"}; }
    S.borrando = false;
    if (r && "ok" in r){ S.borrar = null; S.borrarError = ""; await cargarResultados(); return; }
    S.borrarError = r && r.error === "clave" ? "La contraseña ya no es válida. Vuelve a entrar a los resultados." : "No se pudo eliminar por un problema de conexión. Inténtalo de nuevo.";
    renderRes();
  });
}

/* ---------- Arranque ---------- */
render();
(async () => {
  const marca = leerMarca();
  if (!marca || !CONECTADA) return;
  try {
    const r = await api("existe", marca);
    if (r && r.ok === true){ S.correo = marca; S.enviado = true; if (S.vista === "form") render(); }
    else if (r && r.ok === false) borrarMarca();     // un administrador la eliminó: puede volver a responder
  } catch (e){}
})();
</script>
</body>
</html>
